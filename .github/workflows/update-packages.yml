name: Update Packages

on:
  schedule:
    # Offset from the hour so it does not queue behind every other repository's scheduled jobs.
    - cron: '23 5 * * *'
  workflow_dispatch:

jobs:
  update:
    uses: Cratis/Workflows/.github/workflows/update-packages.yml@925a9a9cad3c3d9f2be8b44acf1788adf675af14
    with:
      post-update-command: python3 Verification/verify-runtime-compatibility.py --self-test --synchronize
      publication-mode: pull-request
      pull-request-label: patch
    secrets:
      PAT_WORKFLOWS: ${{ secrets.PAT_WORKFLOWS }}
