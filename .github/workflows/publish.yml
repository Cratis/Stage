name: Publish

# Keep up to 100 pending Publish runs in FIFO order with `queue: max` (Cratis/Direct#1517).
# The default single pending slot drops the older pending release when a third merge arrives.
# Runs remain serialized and in-flight releases are never cancelled.
# Omit `cancel-in-progress`: GitHub rejects it together with `queue: max`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

env:
  NUGET_OUTPUT: ./Artifacts/NuGet
  DOTNET_VERSION: "10.0.x"

permissions:
  issues: write
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '0.0.0'
        type: string
      release-notes:
        description: 'Release notes'
        required: true
        default: 'No release notes'
        type: string
  # Releasing on push rather than on the pull_request closed event is deliberate. A pull request from a fork
  # runs with a read-only GITHUB_TOKEN and no secrets even on merge, so it cannot create the release or reach
  # the publishing credentials - which is how a merged, labeled fork contribution silently released nothing.
  # A push to main always runs with a full-permission token, and the release action finds the merged pull
  # request and its label from the commit.
  push:
    branches:
      - main
    paths:
      - "Source/**"
      # A package-version-only bump still flows into every build under Source/, so it can warrant a release
      # even though no file under Source/ itself changed.
      - "Directory.Build.props"
      - "Directory.Packages.props"
      # Changes to the publish pipeline itself should be exercised by a release.
      - ".github/workflows/publish.yml"
  # Batched releases (Cratis/Workflows#189, pilot): every 15 minutes, release everything merged since the last
  # release once the oldest pending merge is older than `release-window`. A run with nothing pending, or a window
  # that has not elapsed, ends in seconds without releasing. A `hotfix` label releases on its merge push; a manual
  # run left at version 0.0.0 releases everything pending.
  schedule:
    - cron: '7,22,37,52 * * * *'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      reason: ${{ steps.release.outputs.reason }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Host kernel and client compatibility pins
        run: python3 Verification/verify-runtime-compatibility.py --self-test

      - name: Release
        id: release
        # Pinned to the batched-releases pilot (Cratis/release-action#217); back to @v1 once it is released.
        uses: cratis/release-action@b1c4dbf13ab3fc90bf5b3fb8be64b26006209496
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}
          release-window: 60

  publish-npm-package:
    if: needs.release.outputs.publish == 'true' && needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release]
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: Source/Frontend
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require a non-placeholder release version
        run: test -n "$RELEASE_VERSION" && test "$RELEASE_VERSION" != '0.0.0'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: Source/Frontend/package-lock.json

      - name: Remove token placeholders so npm uses OIDC
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = process.env.NPM_CONFIG_USERCONFIG;
          writeFileSync(path, readFileSync(path, 'utf8').split('\n').filter(line => !line.includes('_authToken')).join('\n'));
          JS
          echo 'NODE_AUTH_TOKEN=' >> "$GITHUB_ENV"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Install workspaces
        run: npm ci

      - name: Build runtime package
        run: npm run build --workspace @cratis/stage.runtime

      - name: Set the Stage release version
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --workspace @cratis/stage.runtime

      - name: Publish runtime package with provenance unless already published
        run: |
          lookup_error="$RUNNER_TEMP/stage-runtime-npm-view.log"
          if existing_version=$(npm view "@cratis/stage.runtime@$RELEASE_VERSION" version 2>"$lookup_error"); then
            test "$existing_version" = "$RELEASE_VERSION"
            echo "@cratis/stage.runtime@$RELEASE_VERSION is already published; skipping npm publish."
          elif grep -qE '^npm (ERR!|error) code E404$' "$lookup_error"; then
            npm publish --access public --provenance --workspace @cratis/stage.runtime
          else
            cat "$lookup_error" >&2
            exit 1
          fi

  publish-dotnet-packages:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release, publish-npm-package]
    permissions:
      # Required for NuGet trusted publishing using OIDC tokens
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Remove any existing artifacts
        run: rm -rf ${{ env.NUGET_OUTPUT }}

      - name: Build
        run: dotnet build --configuration Release -p:Version=${{ needs.release.outputs.version }}

      - name: Create NuGet packages
        run: dotnet pack --no-build --configuration Release -o ${{ env.NUGET_OUTPUT }} -p:Version=${{ needs.release.outputs.version }}

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet packages
        run: dotnet nuget push --skip-duplicate '${{ env.NUGET_OUTPUT }}/*.nupkg' --timeout 900 --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json

  # Host and SpecRunner are plain framework-dependent publishes (no -r, no --self-contained, no
  # PublishReadyToRun), so the output is portable IL that runs unmodified on both amd64 and arm64 - one build
  # is enough. Building here on the host runner (rather than inside the Docker build) means the Docker step
  # never has to compile .NET under QEMU emulation for the arm64 leg of the multi-arch push.
  build-host:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Host
        run: |
          dotnet publish ./Source/Host/Host.csproj \
            -c Release \
            -p:Version=${{ needs.release.outputs.version }} \
            -p:SourceRevisionId=${{ github.sha }} \
            -p:EnableSourceControlManagerQueries=false \
            -p:EnableSourceLink=false \
            -o ./Artifacts/Host

      - name: Upload Host output
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: host-build
          path: ./Artifacts/Host

  build-specrunner:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish SpecRunner
        run: |
          dotnet publish ./Source/SpecRunner/SpecRunner.csproj \
            -c Release \
            -p:Version=${{ needs.release.outputs.version }} \
            -p:SourceRevisionId=${{ github.sha }} \
            -p:EnableSourceControlManagerQueries=false \
            -p:EnableSourceLink=false \
            -o ./Artifacts/SpecRunner

      - name: Upload SpecRunner output
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: specrunner-build
          path: ./Artifacts/SpecRunner

  publish-docker-images:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release, build-host, build-specrunner]
    strategy:
      matrix:
        include:
          - image: cratis/stage
            dockerfile: Source/Host/Dockerfile
            artifact: host-build
            artifact-path: Source/Host/out
          - image: cratis/stage-specrunner
            dockerfile: Source/SpecRunner/Dockerfile
            artifact: specrunner-build
            artifact-path: Source/SpecRunner/out

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          # STAGE_PRIMEUI_LICENSE only matters to the Host image's frontend stage (see its Dockerfile) -
          # harmless as an unconsumed build arg on SpecRunner's, which declares no such ARG.
          build-args: |
            STAGE_PRIMEUI_LICENSE=${{ secrets.PRIMEUI_LICENSE }}
          tags: |
            ${{ matrix.image }}:${{ needs.release.outputs.version }}
            ${{ matrix.image }}:latest

  verify-published:
    # A merge that publishes nothing is the failure mode that silently costs a release: the release job
    # succeeds, every publish job is skipped for want of should-publish, and the whole run reports green. Fail
    # instead, so a release that did not happen cannot be mistaken for one that did.
    #
    # Only for the reasons that mean something went wrong. Publishing nothing is correct and routine for the
    # others - a commit pushed straight to main, a Dependabot merge, a re-run of a run that already released -
    # and failing on those would make this job noise that everyone learns to ignore.
    if: always() && needs.release.result == 'success' && (needs.release.outputs.publish == 'true' || contains(fromJSON('["no-label", "error"]'), needs.release.outputs.reason))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release, publish-npm-package, publish-dotnet-packages, publish-docker-images]

    steps:
      - name: Report that nothing was published
        if: needs.release.outputs.publish != 'true'
        env:
          RELEASE_REASON: ${{ needs.release.outputs.reason }}
        run: |
          echo "::error::Nothing was published and no release was cut (reason: $RELEASE_REASON). For 'no-label', add exactly one of major, minor or patch to the merged pull request and re-run this workflow - see the pull request policy check (verify-pull-request-policy), which is meant to catch this before the merge."
          exit 1

      - name: Require every publication to succeed
        env:
          NPM_RESULT: ${{ needs.publish-npm-package.result }}
          DOTNET_RESULT: ${{ needs.publish-dotnet-packages.result }}
          DOCKER_RESULT: ${{ needs.publish-docker-images.result }}
        run: test "$NPM_RESULT" = success && test "$DOTNET_RESULT" = success && test "$DOCKER_RESULT" = success
