name: Warm NuGet cache

# PR caches belong to refs/pull/<n>/merge and cannot be restored by other PRs.
# Seed the same key on main without repeating the build or spec matrix.
on:
  push:
    branches: [main]
    paths:
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.targets"
      - "**/packages.lock.json"
      - "**/[Nn]u[Gg]et.[Cc]onfig"
      - "*.slnx"
      - "global.json"
      - ".github/workflows/warm-nuget-cache.yml"
  # GitHub evicts caches unused for seven days; a weekly run keeps main's cache alive between dependency changes.
  schedule:
    - cron: "37 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .Net
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Cache NuGet packages
        id: nuget
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main

      # The cache action restores by key prefix (restore-keys) when the exact key misses, so the
      # runner starts with every older package version ever saved. Restoring on top and saving
      # would keep that stale set forever and every PR job would download it. When there is no
      # exact hit, empty the global-packages folder so the restore below repopulates it and the
      # saved cache holds only the versions the current dependency graph resolves.
      - name: Prune stale NuGet packages
        if: steps.nuget.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          listing=$(dotnet nuget locals global-packages --list)
          dir=${listing#global-packages: }
          dir=${dir%$'\r'}
          while [[ "$dir" == */ && "$dir" != / ]]; do dir=${dir%/}; done
          expected="$HOME/.nuget/packages"
          if [[ -z "$dir" || "$dir" != /* || "${dir##*/}" != 'packages' || "${dir%/*}" != "$HOME/.nuget" || "$dir" != "$expected" ]]; then
            echo "::error::Refusing to prune unexpected NuGet global-packages path: '$dir' (expected '$expected')."
            exit 1
          fi
          if [[ -d "$dir" ]]; then
            find "$dir" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          fi
          echo "Emptied $dir before restore."

      - name: Restore solution packages
        if: steps.nuget.outputs.cache-hit != 'true'
        run: dotnet restore --verbosity minimal

      - name: Report NuGet cache composition
        continue-on-error: true
        shell: bash
        run: |
          packages=$(dotnet nuget locals global-packages --list 2>/dev/null) || {
            echo 'NuGet global-packages directory unavailable; skipping diagnostics.'
            exit 0
          }
          packages=${packages#global-packages: }
          if [[ ! -d "$packages" ]]; then
            echo 'NuGet global-packages directory unavailable; skipping diagnostics.'
            exit 0
          fi

          total_bytes=$(find "$packages" -type f -printf '%s\n' | awk '{total += $1} END {printf "%.0f", total}')
          read -r nupkg_bytes nupkg_count < <(
            find "$packages" -type f -name '*.nupkg' -printf '%s\n' |
              awk '{bytes += $1; count++} END {printf "%.0f %d\n", bytes, count}'
          )
          percentage=$(awk -v total="$total_bytes" -v packages="$nupkg_bytes" \
            'BEGIN {printf "%.2f", (total > 0 ? 100 * packages / total : 0)}')
          echo "Global-package file bytes: $total_bytes"
          echo "nupkg bytes: $nupkg_bytes; count: $nupkg_count; percentage: $percentage%"
          echo 'Top 10 package directories by apparent bytes (bytes; nupkg bytes; version dirs; versions):'
          for package_dir in "$packages"/*/; do
            [[ -d "$package_dir" ]] || continue
            package_dir=${package_dir%/}
            dir_bytes=$(find "$package_dir" -type f -printf '%s\n' | awk '{total += $1} END {printf "%.0f", total}')
            dir_nupkg=$(find "$package_dir" -type f -name '*.nupkg' -printf '%s\n' | awk '{total += $1} END {printf "%.0f", total}')
            version_count=0
            versions=''
            for version_dir in "$package_dir"/*/; do
              [[ -d "$version_dir" ]] || continue
              version_dir=${version_dir%/}
              version_count=$((version_count + 1))
              versions+="${version_dir##*/},"
            done
            name=${package_dir##*/}
            printf '%s\t%s\t%s\t%s\t%s\n' "$dir_bytes" "$dir_nupkg" "$version_count" \
              "${name//[[:cntrl:]]/?}" "$(printf '%s' "${versions%,}" | tr -c '[:print:]' '?' | cut -c1-300)"
          done | sort -t "$(printf '\t')" -k1,1nr | head -n 10 |
            awk -F '\t' '{printf "%s: bytes=%s nupkg_bytes=%s versions=%s [%s]\n", $4, $1, $2, $3, $5}' || true
