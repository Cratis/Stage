name: .NET Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/**"
      - "*.props"
      - "*.targets"
      - "*.slnx"
      - "global.json"
      - ".github/workflows/dotnet-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The specs live inline beside the code and are stripped from Release builds, where the test SDK is not
      # referenced either - so a Release test run discovers nothing at all. Debug runs the specs; Release is the
      # zero-warning compile gate.
      - name: Build & run tests
        run: dotnet test --configuration Debug

      - name: Build Release
        run: dotnet build --configuration Release
