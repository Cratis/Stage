name: Update Packages

on:
  schedule:
    # Offset from the hour so it does not queue behind every other repository's scheduled jobs.
    - cron: '23 5 * * *'
  workflow_dispatch:

jobs:
  update:
    uses: Cratis/Workflows/.github/workflows/update-packages.yml@ca872946368c16f7f6f8ad4cffb0d312bac0ad3f
    with:
      # StyleCop.Analyzers stays on 1.2.0-beta.556 like the other Cratis repositories: 1.3.x reports SA1137
      # on correctly indented multi-line collection expressions. Microsoft.NETCore.App.Ref is the reference pack
      # pure-transition admission embeds; it follows PureTransitionReferencePackVersion and PureTransitionAdmission.
      # Bump both deliberately, not automatically.
      nuget-package-exclusions: StyleCop.Analyzers,Microsoft.NETCore.App.Ref
      post-update-command: python3 Verification/verify-runtime-compatibility.py --self-test --synchronize && python3 Verification/synchronize-rendered-pins.py --self-test && python3 Verification/synchronize-rendered-pins.py
      publication-mode: pull-request
      pull-request-label: patch
    secrets:
      PAT_WORKFLOWS: ${{ secrets.PAT_WORKFLOWS }}
