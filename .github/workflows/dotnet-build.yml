name: .NET Build

concurrency:
  # Keep scheduled/manual runs independent; newer pushes still cancel older PR runs.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "24"

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    # Labels do not trigger skipped required checks. For full coverage:
    # add ci:full, then push or use "Re-run all jobs" on the dotnet-build workflow
    # ("Re-run failed jobs" does not rerun routing, so it ignores the label)
    # Draft PRs wait until they are marked ready for review.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "**"
    # Changes outside these paths (documentation, other workflows) do not start this workflow,
    # as before routing existed; inside them, the routing job selects the optional lanes.
    paths:
      - "Source/**"
      - "Samples/**"
      - "Verification/**"
      - "*.props"
      - "*.targets"
      - "*.slnx"
      - "global.json"
      - "**/[Nn]u[Gg]et.[Cc]onfig"
      - "**/packages.lock.json"
      - ".github/workflows/dotnet-build.yml"
      - ".github/spec-shards.py"
      - ".github/spec-shard-timings.json"
      - ".github/test_spec_shards.py"
      - ".github/ci-routing.py"
      - ".github/test_ci_routing.py"
      - ".github/workflows/warm-nuget-cache.yml"

jobs:
  routing:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      reducer-mongo: ${{ steps.routes.outputs.reducer-mongo }}
      live-custom-packages: ${{ steps.routes.outputs.live-custom-packages }}
      live-blueprints: ${{ steps.routes.outputs.live-blueprints }}
      generated-name-matrix: ${{ steps.routes.outputs.generated-name-matrix }}
      generated-react-blueprint-templates: ${{ steps.routes.outputs.generated-react-blueprint-templates }}
      java-bindings: ${{ steps.routes.outputs.java-bindings }}
    steps:
      - name: Checkout merge-base history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select lanes from the PR merge-base diff or full-run event
        id: routes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci-routing.py route

  preflight:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Host kernel and client compatibility pins
        run: python3 Verification/verify-runtime-compatibility.py --self-test

  dotnet-build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: [preflight, routing]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      spec-matrix: ${{ steps.spec-coverage.outputs.matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Source/Frontend/package-lock.json

      - name: Verify container entrypoint supervision
        run: python3 Verification/verify-stage-entrypoint.py

      - name: Build and test frontend
        env:
          # Same PRIMEUI_LICENSE GitHub secret Direct and Studio already build with. A fork PR without
          # secret access just builds unlicensed - see main.tsx and vite.config.ts for the fallback.
          STAGE_PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
        run: |
          npm ci --prefix Source/Frontend
          npm test --prefix Source/Frontend
          npm run build --prefix Source/Frontend

      - name: Verify spec shard routing and guards
        run: python3 -B -m unittest discover -s .github -p 'test_*.py'

      # This job owns analyzers for both configurations. Inline specs and their test SDK exist only in
      # Debug; every spec lane reuses its binaries (including Host's isolated specrunner) with --no-build.
      # Release still compiles without specs and remains the zero-warning/package-validation gate below.
      - name: Build Debug
        run: dotnet build --configuration Debug

      - name: Require every solution test project to be sharded
        id: spec-coverage
        # When the browser lane is omitted, the rendering shard owns its build fixture.
        env:
          BLUEPRINT_TEMPLATES_LANE: ${{ needs.routing.outputs.generated-react-blueprint-templates }}
        run: |
          args=()
          if [ "$BLUEPRINT_TEMPLATES_LANE" = true ]; then
            args+=(--blueprint-templates-lane)
          fi
          python3 .github/spec-shards.py guard "${args[@]}"

      # Artifacts are an intra-run handoff, unlike immutable commit-keyed caches, whose failed saves
      # can poison a rerun. Tar preserves executable permissions and the original project layout.
      - name: Archive Debug build output
        run: |
          find Source -type d -path '*/bin/Debug' -prune -print0 | tar --null -czf build-output.tar.gz -T -

      - name: Upload Debug build output
        uses: actions/upload-artifact@v4
        with:
          name: debug-build-output
          path: build-output.tar.gz
          retention-days: 1
          if-no-files-found: error

      # The version is a sentinel, not a release. Package validation compares assembly versions, and one
      # below the baseline is rejected on that alone before the API surface is ever looked at - so it has to
      # be set on the build, since the pack below reuses what this produces.
      - name: Build Release
        run: dotnet build --configuration Release -p:Version=9999.0.0

      # Package validation only runs on pack, and no pull request packed - so a binary break stayed invisible
      # until the release failed on main, after merge. That is how v3.0.0 came to be tagged with nothing on
      # NuGet. Packing here puts the break in the pull request that causes it.
      - name: Pack
        run: dotnet pack --no-build --configuration Release -o ./Artifacts/NuGet -p:Version=9999.0.0

      - name: Verify standalone packed reducer consumer
        run: python3 Verification/verify-packed-reducer-consumer.py ./Artifacts/NuGet

  specs:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: specs (${{ matrix.name }})
    needs: [preflight, dotnet-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.dotnet-build.outputs.spec-matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        id: nuget
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main
        with:
          mode: restore

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Debug build output
        uses: actions/download-artifact@v4
        with:
          name: debug-build-output

      - name: Extract Debug build output
        run: tar -xzf build-output.tar.gz

      # Compare projection conversion against the same immutable Chronicle visitor as before.
      - name: Fetch Chronicle projection authority
        if: startsWith(matrix.name, 'rendering-')
        run: |
          git init "$RUNNER_TEMP/chronicle-source"
          git -C "$RUNNER_TEMP/chronicle-source" remote add origin https://github.com/Cratis/Chronicle.git
          git -C "$RUNNER_TEMP/chronicle-source" fetch --depth=1 origin 6b32f743afcbeaa0fdeab5b0fa72ab1f40f96e9e
          git -C "$RUNNER_TEMP/chronicle-source" checkout --detach FETCH_HEAD

      # The helper invokes dotnet test --no-build with the guarded filter for each project, then
      # requires a non-empty TRX with executed tests. A zero dotnet exit cannot hide an empty shard.
      # Specs run --no-build against the downloaded output, but some (the template scaffolder) load packages
      # from the local NuGet cache at run time. Without an exact cache hit, restore so they are present.
      - name: Restore packages without an exact cache hit
        if: steps.nuget.outputs.cache-hit != 'true'
        run: dotnet restore --verbosity minimal

      - name: Run specs (${{ matrix.name }})
        env:
          CHRONICLE_SOURCE_ROOT: ${{ runner.temp }}/chronicle-source
          SPEC_SHARD: ${{ toJson(matrix) }}
        run: python3 .github/spec-shards.py run "$SPEC_SHARD"

      - name: Upload spec results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specs-${{ matrix.name }}
          path: TestResults/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7

  # Preserve the original build check as an aggregate: it must fail if preflight, compilation/packaging,
  # any spec shard or the standalone generated-application spec (moved out of the shards) fails or is
  # skipped. The independent live/generated probe checks stay separate.
  build:
    needs: [preflight, dotnet-build, specs, routing, standalone-generated-application]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require preflight, build, every spec shard and the standalone application spec to succeed
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BUILD_RESULT: ${{ needs.dotnet-build.result }}
          SPECS_RESULT: ${{ needs.specs.result }}
          STANDALONE_RESULT: ${{ needs.standalone-generated-application.result }}
        run: test "$PREFLIGHT_RESULT" = success && test "$BUILD_RESULT" = success && test "$SPECS_RESULT" = success && test "$STANDALONE_RESULT" = success

  # Live persistence is a separate gate: the ordinary Debug suite skips live execution of these probes
  # without a connection. The pinned development kernel includes MongoDB, unlike Stage's in-memory Host.
  reducer-mongo:
    needs: [preflight, routing, dotnet-build, specs]
    # Lanes reuse the Debug build output, so they need a passing build; pull requests also wait for specs.
    if: >-
      !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.preflight.result == 'success' && needs.routing.result == 'success'
      && needs.dotnet-build.result == 'success' && (github.event_name != 'pull_request' || needs.specs.result == 'success')
      && needs.routing.outputs.reducer-mongo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        id: nuget
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main
        with:
          mode: restore

      - name: Download Debug build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: debug-build-output

      - name: Extract Debug build output
        run: tar -xzf build-output.tar.gz

      - name: Restore packages without an exact cache hit
        if: steps.nuget.outputs.cache-hit != 'true'
        run: dotnet restore --verbosity minimal

      - name: Start pinned Chronicle with bundled MongoDB
        run: |
          image=$(python3 -c 'import pathlib, runpy; policy = runpy.run_path("Verification/verify-runtime-compatibility.py"); print(policy["host_base"](pathlib.Path("Source/Host/Dockerfile").read_text()).group(1))')
          docker run --detach --name stage-reducer-mongo \
            --publish 127.0.0.1:35000:35000 "$image"
          # Only the local development kernel uses a self-signed certificate.
          curl --insecure --fail --retry 30 --retry-all-errors --retry-delay 2 \
            --connect-timeout 5 --max-time 10 --retry-max-time 120 \
            https://localhost:35000/health

      - name: Run Billing deletion, scoped-projection, routed-append, reducer-filter, reducer-migration and reaction persistence probes
        env:
          STAGE_CHRONICLE_MONGO_CONNECTION: chronicle://localhost:35000
          # Keeps the generated application's own build and test logs with the uploaded results.
          AI_WORK_KEEP: ${{ github.workspace }}/TestResults/reducer-mongo
        run: >-
          dotnet test Source/Rendering.Cratis/Rendering.Cratis.csproj --configuration Debug --no-build
          --filter "FullyQualifiedName~when_verifying_billing_mongo_deletion.mongo_container_matches_model_bound_read_model_query_when_configured|FullyQualifiedName~when_verifying_scoped_projections_against_mongo.should_report_both_mongo_shapes_when_configured|FullyQualifiedName~when_verifying_routed_appends_against_mongo.should_append_all_routes_when_configured|FullyQualifiedName~when_verifying_reducer_filters_against_mongo.should_filter_reducer_appends_when_configured|FullyQualifiedName~when_verifying_reactions_against_the_pinned_kernel.should_settle_event_reactions_when_configured|FullyQualifiedName~when_verifying_reducer_migration_against_the_pinned_kernel.should_keep_one_builder_with_the_previous_observer_id_when_configured|FullyQualifiedName~when_verifying_inline_code_against_the_pinned_kernel.should_verify_demo_when_configured|FullyQualifiedName~when_verifying_inline_code_against_the_pinned_kernel.should_verify_min_a3_when_configured"
          --logger "trx;LogFileName=billing-mongo.trx" --results-directory ./TestResults/reducer-mongo

      - name: Run Stage projection reconnect probe
        env:
          STAGE_CHRONICLE_MONGO_CONNECTION: chronicle://localhost:35000
        run: >-
          dotnet test Source/Host/Host.csproj --configuration Debug --no-build
          --filter "FullyQualifiedName~when_reconnecting_against_the_pinned_kernel.should_keep_stage_projections_updating_when_configured|FullyQualifiedName~when_encrypting_against_the_pinned_kernel.should_encrypt_and_release_concepts_when_configured"
          --logger "trx;LogFileName=stage-reconnect.trx" --results-directory ./TestResults/reducer-mongo

      # A zero exit from dotnet test can mean that nothing ran. Require every named probe to
      # execute and pass, so a missing or skipped probe cannot silently make this gate green.
      - name: Require all live probes to execute and pass
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          roots = [ET.parse("TestResults/reducer-mongo/" + name).getroot()
                   for name in ("billing-mongo.trx", "stage-reconnect.trx")]
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          results = [result for root in roots for result in root.findall("t:Results/t:UnitTestResult", ns)]
          prefix = "Cratis.Stage.Rendering.Cratis.for_CratisArtifactRenderPlanner."
          expected = {
              prefix + "when_verifying_billing_mongo_deletion.mongo_container_matches_model_bound_read_model_query_when_configured",
              prefix + "when_verifying_scoped_projections_against_mongo.should_report_both_mongo_shapes_when_configured",
              prefix + "when_verifying_routed_appends_against_mongo.should_append_all_routes_when_configured",
              prefix + "when_verifying_reducer_filters_against_mongo.should_filter_reducer_appends_when_configured",
              prefix + "when_verifying_reactions_against_the_pinned_kernel.should_settle_event_reactions_when_configured",
              prefix + "when_verifying_reducer_migration_against_the_pinned_kernel.should_keep_one_builder_with_the_previous_observer_id_when_configured",
              prefix + "when_verifying_inline_code_against_the_pinned_kernel.should_verify_demo_when_configured",
              prefix + "when_verifying_inline_code_against_the_pinned_kernel.should_verify_min_a3_when_configured",
              "Cratis.Stage.Host.for_CratisServiceConfiguration.when_reconnecting_against_the_pinned_kernel.should_keep_stage_projections_updating_when_configured",
              "Cratis.Stage.Host.for_CratisServiceConfiguration.when_encrypting_against_the_pinned_kernel.should_encrypt_and_release_concepts_when_configured",
          }
          counters = [root.find("t:ResultSummary/t:Counters", ns) for root in roots]
          if (len(results) != len(expected)
                  or {result.get("testName") for result in results} != expected
                  or any(result.get("outcome") != "Passed" for result in results)
                  or any(counter is None for counter in counters)
                  or sum(int(counter.get("executed", "0")) for counter in counters) != len(expected)):
              raise SystemExit("Billing, scoped-projection, routed-append, reducer-filter, reducer-migration, reaction and Stage reconnect probes must execute and pass, not skip.")
          PY

      - name: Capture kernel logs
        if: always()
        run: |
          mkdir -p TestResults/reducer-mongo
          if docker container inspect stage-reducer-mongo > /dev/null 2>&1; then
            docker logs stage-reducer-mongo > TestResults/reducer-mongo/chronicle.log 2>&1
          fi

      - name: Stop kernel and remove MongoDB volumes
        if: always()
        run: |
          if docker container inspect stage-reducer-mongo > /dev/null 2>&1; then
            docker rm --force --volumes stage-reducer-mongo
          fi

      - name: Upload probe results and kernel logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reducer-mongo-results
          path: TestResults/reducer-mongo
          if-no-files-found: error
          retention-days: 7

  # Compiles renderer output for every generated-name row with Roslyn; admission must reject exactly the
  # names whose generated C# does not compile or serialize. It takes about as long as the rest of the
  # suite, so it runs next to the build job instead of inside it.
  generated-name-matrix:
    needs: [preflight, routing, dotnet-build, specs]
    # Lanes reuse the Debug build output, so they need a passing build; pull requests also wait for specs.
    if: >-
      !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.preflight.result == 'success' && needs.routing.result == 'success'
      && needs.dotnet-build.result == 'success' && (github.event_name != 'pull_request' || needs.specs.result == 'success')
      && needs.routing.outputs.generated-name-matrix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Fetch Chronicle projection authority
        run: |
          git init "$RUNNER_TEMP/chronicle-source"
          git -C "$RUNNER_TEMP/chronicle-source" remote add origin https://github.com/Cratis/Chronicle.git
          git -C "$RUNNER_TEMP/chronicle-source" fetch --depth=1 origin 6b32f743afcbeaa0fdeab5b0fa72ab1f40f96e9e
          git -C "$RUNNER_TEMP/chronicle-source" checkout --detach FETCH_HEAD

      - name: Restore NuGet packages
        id: nuget
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main
        with:
          mode: restore

      - name: Download Debug build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: debug-build-output

      - name: Extract Debug build output
        run: tar -xzf build-output.tar.gz

      - name: Restore packages without an exact cache hit
        if: steps.nuget.outputs.cache-hit != 'true'
        run: dotnet restore --verbosity minimal

      - name: Run generated-name matrix
        env:
          CHRONICLE_SOURCE_ROOT: ${{ runner.temp }}/chronicle-source
        run: dotnet test Source/Conformance.Specs/Conformance.Specs.csproj --configuration Debug --no-build --filter "FullyQualifiedName~when_compiling_generated_name_matrix"

  # Compile self-contained java@1 vectors and check every reference binding with the JDK compiler.
  java-bindings:
    needs: [preflight, routing, dotnet-build, specs]
    # Lanes reuse the Debug build output, so they need a passing build; pull requests also wait for specs.
    if: >-
      !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.preflight.result == 'success' && needs.routing.result == 'success'
      && needs.dotnet-build.result == 'success' && (github.event_name != 'pull_request' || needs.specs.result == 'success')
      && needs.routing.outputs.java-bindings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .Net
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        id: nuget
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main
        with:
          mode: restore

      - name: Download Debug build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: debug-build-output

      - name: Extract Debug build output
        run: tar -xzf build-output.tar.gz

      - name: Restore packages without an exact cache hit
        if: steps.nuget.outputs.cache-hit != 'true'
        run: dotnet restore --verbosity minimal

      - name: Emit the java@1 binding vectors
        env:
          STAGE_JAVA_BINDING_VECTORS: ${{ runner.temp }}/java-binding-vectors
        run: dotnet test Source/Rendering.Languages/Rendering.Languages.csproj --configuration Debug --no-build --filter "FullyQualifiedName~for_JavaBindingVectors.when_emitting_the_binding_vectors"

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile the vectors and check every reference binding
        run: bash Verification/java-bindings/run.sh "${{ runner.temp }}/java-binding-vectors" "$PWD/TestResults/java-bindings"

      - name: Upload Java binding results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: java-bindings-results
          path: TestResults/java-bindings
          if-no-files-found: error
          retention-days: 7

  # Renders an application, then builds and tests it in Debug and Release and serves it against the pinned
  # Chronicle image. That one class took longer than every other spec in its Rendering shard together, so it
  # runs next to the build job instead of setting the shard time. spec-shards.py excludes it from every shard.
  standalone-generated-application:
    needs: [preflight, routing, dotnet-build]
    # Unlike the other heavy lanes, this one starts as soon as the build passes, next to the spec shards: it is
    # part of the required `build` aggregate, so waiting for the shards first put both on the critical path.
    if: >-
      !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.preflight.result == 'success' && needs.routing.result == 'success'
      && needs.dotnet-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Same toolchain the Rendering shards gave this spec before it moved here.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore NuGet packages
        id: nuget
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main
        with:
          mode: restore

      - name: Download Debug build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: debug-build-output

      - name: Extract Debug build output
        run: tar -xzf build-output.tar.gz

      - name: Restore packages without an exact cache hit
        if: steps.nuget.outputs.cache-hit != 'true'
        run: dotnet restore --verbosity minimal

      - name: Build, test and serve the standalone generated application
        run: >-
          dotnet test Source/Rendering.Cratis/Rendering.Cratis.csproj --configuration Debug --no-build
          --filter "FullyQualifiedName~when_verifying_a_standalone_generated_application"
          --logger "trx;LogFileName=standalone-generated-application.trx" --results-directory ./TestResults/standalone-generated-application

      # A zero exit from dotnet test can mean that nothing ran, or that assertions were skipped.
      - name: Require every standalone application assertion to execute and pass
        run: |
          python3 .github/spec-shards.py require-executed TestResults/standalone-generated-application/standalone-generated-application.trx
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          root = ET.parse("TestResults/standalone-generated-application/standalone-generated-application.trx").getroot()
          results = root.findall("t:Results/t:UnitTestResult", ns)
          if len(results) != 13 or any(result.get("outcome") != "Passed" for result in results):
              raise SystemExit(f"Expected 13 passing standalone application assertions, got {[(r.get('testName'), r.get('outcome')) for r in results]}.")
          print(f"{len(results)} standalone application assertions passed")
          PY

      - name: Upload spec results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-generated-application-results
          path: TestResults/standalone-generated-application
          if-no-files-found: error
          retention-days: 7

  # Builds the Stage image the way publish.yml does and starts it against a model whose ui profile names a custom package,
  # handing it the approved package set and the package's browser build as `cratis run --package-set` does. A browser asserts
  # the live Stage loaded the package at runtime and rendered its component, and refused to render when the package is missing.
  live-custom-packages:
    needs: [preflight, routing, dotnet-build, specs]
    # Pull requests start heavy lanes only after build and specs pass; nightly/manual runs keep full coverage.
    if: >-
      !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.preflight.result == 'success' && needs.routing.result == 'success'
      && (github.event_name != 'pull_request' || (needs.dotnet-build.result == 'success' && needs.specs.result == 'success'))
      && (needs.routing.outputs.live-custom-packages == 'true' || needs.routing.outputs.live-blueprints == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      custom-result: ${{ steps.custom.outcome }}
      navigation-result: ${{ steps.navigation.outcome }}
      blueprints-result: ${{ steps.blueprints.outcome }}
      templates-result: ${{ steps.templates.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Verification/generated-react-browser/package-lock.json

      - name: Restore NuGet packages
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main
        with:
          mode: restore

      - name: Publish Host
        run: >-
          dotnet publish ./Source/Host/Host.csproj -c Release -p:Version=0.0.0-ci -p:RunAnalyzers=false
          -p:EnableSourceControlManagerQueries=false -p:EnableSourceLink=false -o ./Source/Host/out

      - name: Build the Stage image
        run: docker build --file Source/Host/Dockerfile --tag cratis/stage:ci .

      - name: Install the browser harness
        working-directory: Verification/generated-react-browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the live custom package scenarios
        id: custom
        if: needs.routing.outputs.live-custom-packages == 'true'
        run: Verification/live-custom-packages/run.sh cratis/stage:ci "$PWD/TestResults/live-custom-packages"

      - name: Run the live navigation scenarios
        id: navigation
        if: needs.routing.outputs.live-custom-packages == 'true'
        run: Verification/live-navigation/run.sh cratis/stage:ci "$PWD/TestResults/live-navigation"

      - name: Run the live domain blueprint scenarios
        id: blueprints
        if: needs.routing.outputs.live-blueprints == 'true'
        run: Verification/live-blueprints/run.sh cratis/stage:ci "$PWD/TestResults/live-blueprints"

      - name: Run the live blueprint template scenarios
        id: templates
        if: needs.routing.outputs.live-blueprints == 'true'
        run: Verification/blueprint-templates/live.sh cratis/stage:ci "$PWD/TestResults/live-blueprint-templates"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-custom-packages-results
          path: |
            TestResults/live-custom-packages
            TestResults/live-navigation
            TestResults/live-blueprints
            TestResults/live-blueprint-templates
          if-no-files-found: error
          retention-days: 7

  # Renders the canonical screen-composition corpus into a generated React application, builds it the way its author
  # would (Debug backend with its proxies and generated specifications, npm install, frontend build), then serves it
  # on its own backend against the pinned Chronicle kernel and runs the browser scenarios used against a live Stage.
  generated-react:
    needs: [preflight, routing, dotnet-build, specs]
    # Lanes reuse the Debug build output, so they need a passing build; pull requests also wait for specs.
    if: >-
      !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.preflight.result == 'success' && needs.routing.result == 'success'
      && needs.dotnet-build.result == 'success' && (github.event_name != 'pull_request' || needs.specs.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Verification/generated-react-browser/package-lock.json

      - name: Restore NuGet packages
        id: nuget
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main
        with:
          mode: restore

      - name: Download Debug build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: debug-build-output

      - name: Extract Debug build output
        run: tar -xzf build-output.tar.gz

      - name: Restore packages without an exact cache hit
        if: steps.nuget.outputs.cache-hit != 'true'
        run: dotnet restore --verbosity minimal

      - name: Render and build the generated application
        env:
          STAGE_GENERATED_REACT_KEEP: ${{ runner.temp }}/generated-react
        run: >-
          dotnet test Source/Rendering.Cratis/Rendering.Cratis.csproj --configuration Debug --no-build
          --filter "FullyQualifiedName~when_building_the_generated_screen_composition_application"
          --logger "trx;LogFileName=generated-react.trx" --results-directory ./TestResults/generated-react

      # A zero exit from dotnet test can mean that nothing ran.
      - name: Require the build specification to execute and pass
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          root = ET.parse("TestResults/generated-react/generated-react.trx").getroot()
          results = root.findall("t:Results/t:UnitTestResult", ns)
          if len(results) != 8 or any(result.get("outcome") != "Passed" for result in results):
              raise SystemExit(f"Expected 8 passing generated React build assertions, got {[(r.get('testName'), r.get('outcome')) for r in results]}.")
          print(f"{len(results)} generated React build assertions passed")
          PY

      - name: Build the generated backend for serving
        working-directory: ${{ runner.temp }}/generated-react
        run: dotnet build Workspaces.csproj --configuration Release --nologo

      - name: Install the browser harness
        working-directory: Verification/generated-react-browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node screen-composition.cjs --self-test

      - name: Run the browser scenarios against the generated application
        run: Verification/generated-react-browser/run.sh "${{ runner.temp }}/generated-react" "$PWD/TestResults/generated-react/browser-result.json"

      - name: Upload build and browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-react-results
          path: TestResults/generated-react
          if-no-files-found: error
          retention-days: 7

  # Renders the default blueprint's MasterDetail, Dashboard and ProfileSettings templates (Verification/blueprint-templates) into a generated React
  # application, builds it the way its author would and runs the template vector - slots filled, no overflow, layout, accessibility - against it.
  generated-react-blueprint-templates:
    needs: [preflight, routing, dotnet-build, specs]
    # Lanes reuse the Debug build output, so they need a passing build; pull requests also wait for specs.
    if: >-
      !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.preflight.result == 'success' && needs.routing.result == 'success'
      && needs.dotnet-build.result == 'success' && (github.event_name != 'pull_request' || needs.specs.result == 'success')
      && needs.routing.outputs.generated-react-blueprint-templates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Verification/generated-react-browser/package-lock.json

      - name: Restore NuGet packages
        id: nuget
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main
        with:
          mode: restore

      - name: Download Debug build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: debug-build-output

      - name: Extract Debug build output
        run: tar -xzf build-output.tar.gz

      - name: Restore packages without an exact cache hit
        if: steps.nuget.outputs.cache-hit != 'true'
        run: dotnet restore --verbosity minimal

      - name: Render and build the generated application
        env:
          STAGE_BLUEPRINT_TEMPLATES_KEEP: ${{ runner.temp }}/generated-blueprint-templates
        run: >-
          dotnet test Source/Rendering.Cratis/Rendering.Cratis.csproj --configuration Debug --no-build
          --filter "FullyQualifiedName~when_building_the_blueprint_templates_application"
          --logger "trx;LogFileName=blueprint-templates.trx" --results-directory ./TestResults/generated-blueprint-templates

      - name: Require the build specification to execute and pass
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          root = ET.parse("TestResults/generated-blueprint-templates/blueprint-templates.trx").getroot()
          results = root.findall("t:Results/t:UnitTestResult", ns)
          if len(results) != 5 or any(result.get("outcome") != "Passed" for result in results):
              raise SystemExit(f"Expected 5 passing blueprint template build assertions, got {[(r.get('testName'), r.get('outcome')) for r in results]}.")
          print(f"{len(results)} blueprint template build assertions passed")
          PY

      - name: Build the generated backend for serving
        working-directory: ${{ runner.temp }}/generated-blueprint-templates
        run: dotnet build Workspaces.csproj --configuration Release --nologo

      - name: Install the browser harness
        working-directory: Verification/generated-react-browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the blueprint template vector against the generated application
        env:
          STAGE_GENERATED_REACT_SCENARIO: ${{ github.workspace }}/Verification/blueprint-templates/generated-scenario.cjs
        run: Verification/generated-react-browser/run.sh "${{ runner.temp }}/generated-blueprint-templates" "$PWD/TestResults/generated-blueprint-templates/browser-result.json"

      - name: Upload build and browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-blueprint-templates-results
          path: TestResults/generated-blueprint-templates
          if-no-files-found: error
          retention-days: 7

  # Require this check alongside build: a selected lane/step may not silently skip.
  routed-checks:
    needs: [routing, reducer-mongo, generated-name-matrix, live-custom-packages, generated-react, generated-react-blueprint-templates, java-bindings]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require every selected lane and the React smoke to succeed
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: python3 .github/ci-routing.py check

  nightly-red:
    needs: [build, routed-checks]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.event_name == 'schedule' && (needs.build.result != 'success' || needs.routed-checks.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Open or update the red-nightly issue with the last-green merge range
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci-routing.py report-nightly
