name: Axon generated applications

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version for the boot smoke harness
        type: string
        default: "24"

permissions:
  contents: read

# Reusable workflows do not inherit caller env; routing tests keep these defaults aligned.
env:
  DOTNET_VERSION: "10.0.x"

jobs:
  axon-render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .Net
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore package cache
        id: nuget
        uses: Cratis/Workflows/.github/actions/dotnet-cache@e888941700d2359a8b314f99c18c49b7bee93e3f # main
        with:
          mode: restore

      - name: Download the same-run Debug assemblies
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: debug-build-output

      - name: Extract original Debug bin trees
        run: tar -xzf build-output.tar.gz

      - name: Restore runtime packages without an exact cache hit
        if: steps.nuget.outputs.cache-hit != 'true'
        run: dotnet restore --verbosity minimal

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Source/Rendering.Axon/Emitters/Scaffold/AxonMavenProject.cs

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Exercise native-report failure and skip-count guards
        run: >-
          dotnet test Source/Rendering.Axon.Verification/Rendering.Axon.Verification.csproj
          --configuration Debug --no-build --logger 'trx;LogFileName=axon-verification.trx'
          --results-directory "$RUNNER_TEMP/axon-results/harness"

      - name: Reject missing or unexecuted guard tests
        run: python3 .github/spec-shards.py require-executed "$RUNNER_TEMP/axon-results/harness/axon-verification.trx"

      - name: Render all applications with the solution-built harness
        run: >-
          dotnet run --project Source/Rendering.Axon.Verification/Rendering.Axon.Verification.csproj
          --configuration Debug --no-build -- render "$RUNNER_TEMP/axon-corpus"

      - name: Compile and execute every generated Maven module
        working-directory: ${{ runner.temp }}/axon-corpus
        timeout-minutes: 15
        run: sh ./mvnw -B -ntp -fae verify

      - name: Enforce the checked-in disabled-test budget and print counts by reason
        run: >-
          dotnet run --project Source/Rendering.Axon.Verification/Rendering.Axon.Verification.csproj
          --configuration Debug --no-build -- verify "$RUNNER_TEMP/axon-corpus"

      - name: Boot every packaged application and require live HTTP
        timeout-minutes: 20
        run: node Source/Rendering.Axon.Verification/boot-smoke.mjs "$RUNNER_TEMP/axon-corpus" "$RUNNER_TEMP/axon-results/boot"

      - name: Verify persistent views survive a restart
        working-directory: ${{ runner.temp }}/axon-corpus
        timeout-minutes: 5
        run: sh ./mvnw -B -ntp -pl orders -Dtest=PersistentRestartProbe -Dstage.restart=true -Dstage.expectViews=true test

      - name: Preserve real test reports and boot diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axon-native-reports
          path: |
            ${{ runner.temp }}/axon-results/**
            ${{ runner.temp }}/axon-corpus/**/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 7
