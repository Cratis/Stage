name: .NET Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/**"
      - "*.props"
      - "*.targets"
      - "*.slnx"
      - "global.json"
      - ".github/workflows/dotnet-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The specs live inline beside the code and are stripped from Release builds, where the test SDK is not
      # referenced either - so a Release test run discovers nothing at all. Debug runs the specs; Release is the
      # zero-warning compile gate.
      - name: Build & run tests
        run: dotnet test --configuration Debug

      # The version is a sentinel, not a release. Package validation compares assembly versions, and one
      # below the baseline is rejected on that alone before the API surface is ever looked at - so it has to
      # be set on the build, since the pack below reuses what this produces.
      - name: Build Release
        run: dotnet build --configuration Release -p:Version=9999.0.0

      # Package validation only runs on pack, and no pull request packed - so a binary break stayed invisible
      # until the release failed on main, after merge. That is how v3.0.0 came to be tagged with nothing on
      # NuGet. Packing here puts the break in the pull request that causes it.
      - name: Pack
        run: dotnet pack --no-build --configuration Release -o ./Artifacts/NuGet -p:Version=9999.0.0
